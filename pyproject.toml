[project]
name = "hommi-train"
version = "0.7.2"
description = "Training and TensorRT evaluation pipeline for HoMMI diffusion policies and hommi-dataset HDF5 files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "umeow0716", email = "jj30462281@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.18.2,<1",
    "h5py>=3.16.0",
    "hommi-dataset>=0.2.0",
    "hommi-diffusion-policy>=0.2.0",
    "numpy>=2.0.0",
    "PyYAML>=6.0",
    "torch>=2.11",
    "torchcodec>=0.12,<1",
    "torch-tensorrt>=2.11,<3",
    "tensorrt",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
hommi-train = "hommi_train.cli:main"

[project.urls]
Repository = "https://github.com/umeow0716/hommi_train"
Issues = "https://github.com/umeow0716/hommi_train/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hommi-diffusion-policy = { git = "https://github.com/umeow0716/hommi_diffusion_policy.git" }
hommi-dataset = { git = "https://github.com/umeow0716/hommi_dataset.git" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
